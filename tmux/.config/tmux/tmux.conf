# [[ TERMINAL ]]
set -g  default-terminal "tmux-256color"    # TERM inside tmux; screen* has no italics
set -as terminal-features ",xterm*:RGB:usstyle:clipboard:hyperlinks:extkeys"

# Modern key encoding for things like Shift/Ctrl+Enter
set -g extended-keys always                 # forward extended keys even if unrequested
set -g extended-keys-format csi-u           # not redundant: tmux defaults to `xterm`

# [[ GENERAL ]]
set -sg escape-time 10                      # how long a bare Esc waits to be a sequence
set -g focus-events on                      # broadcast terminal focus changes to applications running inside tmux
setw -g aggressive-resize on                # size to the smallest client actually viewing
set -g display-time 4000                    # tmux default is 750ms
set -g status-keys emacs                    # only for prefix+:
set -g history-limit 50000
set -g mouse on
setw -g mode-keys vi
set -g base-index 1                         # windows start at 1
setw -g pane-base-index 1                   # ...and so do panes
set -g renumber-windows on                  # expected numbering when closing a window
set -g set-clipboard on                     # apps in a pane can set the clipboard (OSC 52)
set -g allow-passthrough on                 # apps can talk to the outer terminal directly

# [[ KEYBINDS ]]
# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Define split behavior
unbind '"'
unbind %
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
# Join the marked pane into current pane
bind H join-pane -v -s '{marked}'
bind V join-pane -h -s '{marked}'
bind W attach -c "#{pane_current_path}" \; display "CWD -> #{pane_current_path}"
unbind-key x                                # unbind-key x from asking for confirmation
bind-key x kill-pane

# Misc
bind t set-option -g status                 # toggle the status bar, was "display time" or something lol
bind C-p previous-window
bind C-n next-window

bind . command-prompt -I "#S" "rename-session '%%'"
bind R source-file ~/.dotfiles/tmux/.config/tmux/tmux.conf \; display "Config reloaded!"
bind Y run-shell "echo -n '#{pane_current_path}' | wl-copy" \; display "Copied CWD to clipboard!"
# TODO: for hopping easily between host <-> remote, hacky soln
# script in ~/.local/bin/scripts/tmux-switch-session.sh
# HOST
bind g detach-client -E 'tmux-switch-session.sh machine'
# CLIENT
# bind g detach-client

# Swapping windows
bind -n S-Left  swap-window -d -t -1
bind -n S-Right swap-window -d -t +1
# Resizing panes
bind -n C-Up    resize-pane -U 4
bind -n C-Down  resize-pane -D 4
bind -n C-Left  resize-pane -L 4
bind -n C-Right resize-pane -R 4

# [[ COPY MODE ]]
# TODO: trying tmux-thumbs so will keep as backup
unbind [
bind Space copy-mode
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi V      send -X select-line
bind -T copy-mode-vi C-v    run-shell 'tmux send-keys -X rectangle-toggle; tmux send-keys -X begin-selection'
bind -T copy-mode-vi y      send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H      send -X start-of-line
bind -T copy-mode-vi L      send -X end-of-line

# [[ COLORS ]]
# Status bar
set -g status-justify centre
set -g status-position top
set -g status-interval 5                    # clock shows minutes; 60 left it stale
set -g status-style "fg=#c5c8c6,bg=#282a2e"
set -g status-left  "#[fg=#1d1f21,bg=#81a2be,bold] #S #[default]"
set -g status-right "#[fg=#707880,bg=#282a2e,nobold]#{?client_prefix,#[fg=#cc6666]<P> ,}#{?client_ssh,#[fg=#b5bd68] #h ,}#[fg=#1d1f21,bg=#81a2be,bold] %a %m/%d %I:%M %p #[default]"


# Window list
setw -g window-status-style "fg=#707880,bg=#282a2e"
setw -g window-status-current-style "fg=#c5c8c6,bg=#373b41,bold"
setw -g window-status-separator ""
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format "#[fg=#282a2e,bg=#373b41]#[fg=#81a2be] #I:#W#[fg=#f0c674]#F #[fg=#373b41,bg=#282a2e]"

# Borders and messages
set -g pane-border-style "fg=#54546d,bg=#1f1f28"
set -g pane-active-border-style "fg=#8992a7,bg=#1f1f28"
set -g message-style "fg=#c5c8c6,bg=#373b41"
set -g message-command-style "fg=#c5c8c6,bg=#373b41"
set -g display-panes-active-colour "#81a2be"    # prefix + q
set -g display-panes-colour "#707880"

# Copy mode: selection, all search hits, current search hit
setw -g mode-style "fg=#c8c093,bg=#43436c"
set -g copy-mode-match-style "fg=#c8c093,bg=#43436c"
set -g copy-mode-current-match-style "fg=#1f1f28,bg=#c4b28a,bold"

# [[ PLUGINS ]]
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'  # C-hjkl across tmux panes and vim splits
set -g @plugin 'tmux-plugins/tmux-resurrect'     # prefix C-s save / prefix C-r restore
set -g @resurrect-capture-pane-contents 'on'
set -g @plugin 'laktak/extrakto'

run '~/.config/tmux/plugins/tpm/tpm'             # keep last
